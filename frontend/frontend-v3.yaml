apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-v3-deployment
  labels:
    app: frontend-v3
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend-v3
  template:
    metadata:
      labels:
        app: frontend-v3
    spec:
      containers:
      - name: frontend-v3
        image: crosslifedocker/vue-frontend:v3
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-v3-service
  labels:
    app: frontend-v3
spec:
  selector:
    app: frontend-v3
  ports:
  - port: 80
    targetPort: 80
  type: ClusterIP
